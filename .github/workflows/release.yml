name: Build & Release Agent

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Kiosk.slnx

      - name: Build
        run: dotnet build Kiosk.slnx -c Release --no-restore

  release:
    name: Release agent
    needs: build
    # Native arm64 host so the self-contained linux-arm64 AppImage is built cleanly.
    runs-on: ubuntu-24.04-arm
    # Avoid overlapping releases when several pushes land close together.
    concurrency:
      group: agent-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:INPUT_VERSION) {
            # Manual override wins.
            $next = $env:INPUT_VERSION
          }
          else {
            # Auto-increment: take the latest release tag (vMAJOR.MINOR.PATCH)
            # and bump the PATCH by one. Falls back to 1.0.0 for the first release.
            $latest = (gh release view --json tagName --jq .tagName 2>$null) -replace '^v', ''
            $global:LASTEXITCODE = 0  # 'gh' exits 1 when no release exists yet; don't fail the step.
            if ([string]::IsNullOrWhiteSpace($latest)) {
              $next = '1.0.0'
            }
            else {
              $v = [version]$latest
              $next = "$($v.Major).$($v.Minor).$($v.Build + 1)"
            }
          }
          Write-Host "Next version: $next"
          "value=$next" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Publish agent (self-contained linux-arm64)
        run: >
          dotnet publish Agent/Agent.csproj
          -c Release
          -r linux-arm64
          --self-contained true
          -o publish

      - name: Download existing releases (for delta updates)
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack Velopack release
        run: >
          vpk pack
          --packId KioskAgent
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe KioskAgent
          --runtime linux-arm64

      - name: Upload GitHub release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "KioskAgent ${{ steps.version.outputs.value }}"
          --tag v${{ steps.version.outputs.value }}
