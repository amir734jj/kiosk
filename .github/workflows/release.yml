name: Build & Release Agent

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Kiosk.slnx

      - name: Build
        run: dotnet build Kiosk.slnx -c Release --no-restore

  release:
    name: Release agent
    needs: build
    # Only publish a release on a version tag or a manual run.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Native arm64 host so the self-contained linux-arm64 AppImage is built cleanly.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Publish agent (self-contained linux-arm64)
        run: >
          dotnet publish Agent/Agent.csproj
          -c Release
          -r linux-arm64
          --self-contained true
          -o publish

      - name: Download existing releases (for delta updates)
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack Velopack release
        run: >
          vpk pack
          --packId KioskAgent
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe KioskAgent
          --runtime linux-arm64

      - name: Upload GitHub release
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "KioskAgent ${{ steps.version.outputs.value }}"
          --tag v${{ steps.version.outputs.value }}
