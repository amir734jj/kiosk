name: Build & Release Agent

on:
  push:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Kiosk.slnx

      - name: Build
        run: dotnet build Kiosk.slnx -c Release --no-restore

  release:
    name: Release agent
    needs: build
    # Native arm64 host. It also cross-publishes the linux-x64 AppImage.
    runs-on: ubuntu-24.04-arm
    # Avoid overlapping releases when several pushes land close together.
    concurrency:
      group: agent-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if ($env:INPUT_VERSION) {
            # Manual override wins.
            $next = $env:INPUT_VERSION
          }
          else {
            # Auto-increment: take the latest release tag (vMAJOR.MINOR.PATCH)
            # and bump the PATCH by one. Falls back to 1.0.0 for the first release.
            $latest = (gh release view --json tagName --jq .tagName 2>$null) -replace '^v', ''
            $global:LASTEXITCODE = 0  # 'gh' exits 1 when no release exists yet; don't fail the step.
            if ([string]::IsNullOrWhiteSpace($latest)) {
              $next = '1.0.0'
            }
            else {
              $v = [version]$latest
              $next = "$($v.Major).$($v.Minor).$($v.Build + 1)"
            }
          }
          Write-Host "Next version: $next"
          "value=$next" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build & publish releases (linux-arm64 + linux-x64)
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # One self-contained AppImage per architecture. Each RID gets its own
          # Velopack channel so the Pi (arm64) and desktops (x64) never pull the
          # wrong asset; both are merged into a single GitHub release/tag.
          for RID in linux-arm64 linux-x64; do
            echo "::group::Release $RID"
            dotnet publish Agent/Agent.csproj -c Release -r "$RID" --self-contained true -o "publish/$RID"
            # Pull the current release for this channel so Velopack can build
            # deltas (ignored on the very first release).
            vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --channel "$RID" --outputDir "rel/$RID" || true
            vpk pack --packId KioskAgent --packVersion "$VERSION" --packDir "publish/$RID" --mainExe KioskAgent --runtime "$RID" --channel "$RID" --outputDir "rel/$RID"
            vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --publish --merge --channel "$RID" --outputDir "rel/$RID" --releaseName "KioskAgent $VERSION" --tag "v$VERSION"
            # Stable, arch-specific asset name for first-time installs (setup.sh).
            appimage="$(ls -1 "rel/$RID"/*.AppImage | head -n1)"
            cp -f "$appimage" "KioskAgent-$RID.AppImage"
            gh release upload "v$VERSION" "KioskAgent-$RID.AppImage" --clobber --repo "${{ github.repository }}"
            echo "::endgroup::"
          done
